<svg xmlns="http://www.w3.org/2000/svg" width="680" height="434" viewBox="0 0 680 434" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="680" height="434" fill="#ffffff"/>

  <rect x="65" y="30" width="110" height="40" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
  <text x="120" y="50" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1f2937">浏览器</text>

  <rect x="285" y="30" width="110" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#064e3b">RM 应用</text>

  <rect x="505" y="30" width="110" height="40" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="560" y="50" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#4c1d95">文档服务</text>

  <line x1="120" y1="70" x2="120" y2="416" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="340" y1="70" x2="340" y2="416" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="560" y1="70" x2="560" y2="416" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 4"/>

  <line x1="120" y1="100" x2="328" y2="100" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="326,94 326,106 338,100" fill="#6b7280"/>
  <text x="230" y="91" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563" stroke="#ffffff" stroke-width="3" paint-order="stroke">1 打开编辑页</text>

  <line x1="340" y1="142" x2="132" y2="142" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="134,136 134,148 122,142" fill="#6b7280"/>
  <text x="230" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563" stroke="#ffffff" stroke-width="3" paint-order="stroke">2 配置 + token（服务端签）</text>

  <line x1="120" y1="184" x2="548" y2="184" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="546,178 546,190 558,184" fill="#6b7280"/>
  <text x="340" y="175" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563" stroke="#ffffff" stroke-width="3" paint-order="stroke">3 加载 api.js、DocEditor 初始化</text>

  <line x1="560" y1="226" x2="352" y2="226" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="354,220 354,232 342,226" fill="#6b7280"/>
  <text x="450" y="217" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563" stroke="#ffffff" stroke-width="3" paint-order="stroke">4 ② 拉取源文件</text>

  <line x1="120" y1="268" x2="548" y2="268" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="546,262 546,274 558,268" fill="#6b7280"/>
  <text x="340" y="259" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563" stroke="#ffffff" stroke-width="3" paint-order="stroke">5 用户编辑、点击保存</text>

  <line x1="560" y1="310" x2="352" y2="310" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="354,304 354,316 342,310" fill="#6b7280"/>
  <text x="450" y="301" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563" stroke="#ffffff" stroke-width="3" paint-order="stroke">6 callback status 2 / 6</text>

  <line x1="340" y1="352" x2="548" y2="352" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="546,346 546,358 558,352" fill="#6b7280"/>
  <text x="450" y="343" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563" stroke="#ffffff" stroke-width="3" paint-order="stroke">7 ③ 回拉新文件</text>

  <line x1="340" y1="394" x2="548" y2="394" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="546,388 546,400 558,394" fill="#6b7280"/>
  <text x="450" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563" stroke="#ffffff" stroke-width="3" paint-order="stroke">8 返回 {error:0}</text>

  <text x="340" y="424" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6b7280">实线为请求，虚线为响应；第 3 步跨过 RM，是因为 api.js 由浏览器直接向文档服务取</text>
</svg>
